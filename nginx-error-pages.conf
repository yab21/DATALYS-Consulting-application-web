# Configuration Nginx pour pages d'erreur personnalisées
# À ajouter dans votre configuration Nginx sur Hostinger

server {
    listen 80;
    listen 443 ssl http2;
    server_name applicationweb.datalysconsulting.com;
    
    # Configuration SSL (vos certificats existants)
    # ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;
    
    # Pages d'erreur personnalisées
    error_page 502 503 504 /502.html;
    error_page 500 /500.html;
    error_page 404 /404.html;
    
    # Localisation des pages d'erreur statiques
    location = /502.html {
        root /var/www/datalys-app/shared/public;
        internal;
    }
    
    location = /500.html {
        root /var/www/datalys-app/shared/public;
        internal;
    }
    
    location = /404.html {
        root /var/www/datalys-app/shared/public;
        internal;
    }
    
    # Configuration principale de votre application
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts pour éviter les 502
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Servir les assets statiques directement
    location /static/ {
        alias /var/www/datalys-app/shared/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Servir les fichiers Next.js statiques
    location /_next/static/ {
        alias /var/www/datalys-app/current/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}