name: Deploy DATALYS App via Git Pull

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: "18.x"
  SERVER_HOST: "82.112.253.137"
  APP_NAME: "datalys-app"
  DEPLOY_PATH: "/var/www/datalys-app-git"

jobs:
  # Tests
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run tests (if available)
        run: npm run test --if-present

  # Déploiement Git Pull
  deploy:
    name: Deploy to Production via Git Pull
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Check server connectivity
        run: |
          echo "Checking server availability..."
          for i in {1..3}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@${{ env.SERVER_HOST }} "echo 'Server ready'"; then
              echo "Server accessible"
              break
            fi
            echo "Server not ready, waiting 10s... ($i/3)"
            sleep 10
            if [ $i -eq 3 ]; then
              echo "Server connectivity issues - aborting"
              exit 1
            fi
          done

      - name: Stop PM2 processes
        run: |
          echo "Stopping existing PM2 processes..."
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            pm2 delete datalys-app 2>/dev/null || echo 'No processes to delete'
            sleep 2
            echo 'PM2 processes stopped'
          " || echo "PM2 stop completed"

      - name: Deploy via Git Pull
        timeout-minutes: 15
        run: |
          echo "Deploying via Git Pull..."
          
          # Step 1: Update code (fast)
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 root@${{ env.SERVER_HOST }} "
            set -e
            cd ${{ env.DEPLOY_PATH }}
            
            echo 'Pulling latest code...'
            git stash push -m 'Auto-stash before deploy' || echo 'Nothing to stash'
            git fetch origin
            git reset --hard origin/develop
            git clean -fd
            
            echo 'Setting up environment...'
            ln -sf /var/www/datalys-app/shared/.env .env || echo 'Env link exists'
            ln -sf /var/www/datalys-app/shared/logs logs || echo 'Logs link exists'
            
            echo 'Code update completed!'
          "
          
          # Step 2: Dependencies and build (with aggressive timeouts)
          echo "Starting dependency installation and build in background..."
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=2 root@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            
            echo 'Installing dependencies with timeout protection...'
            export NODE_OPTIONS='--max_old_space_size=256'
            
            # Try fast install with 5 minute timeout
            nohup bash -c '
              timeout 300 npm ci --omit=dev --prefer-offline --no-audit --no-fund --silent 2>/dev/null || {
                echo \"Fast install failed, trying npm install...\"
                rm -rf node_modules
                timeout 420 npm install --production --prefer-offline --no-audit --no-fund --silent 2>/dev/null || {
                  echo \"Install timeout, using cached build...\"
                  exit 1
                }
              }
              
              echo \"Building Next.js application...\"
              timeout 300 npm run build || {
                echo \"Build timeout or failed\"
                exit 1
              }
              
              echo \"SUCCESS\" > /tmp/deploy-status
            ' > /tmp/deploy.log 2>&1 &
            
            echo \$! > /tmp/deploy.pid
            echo 'Deployment started in background'
          " || echo "Background deployment initiated"
          
          # Step 3: Monitor deployment progress
          echo "Monitoring deployment progress..."
          for i in {1..18}; do
            echo "Checking deployment progress ($i/18)..."
            
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@${{ env.SERVER_HOST }} "
              if [ -f /tmp/deploy-status ]; then
                echo 'Deployment completed successfully!'
                rm -f /tmp/deploy.pid /tmp/deploy-status
                exit 0
              elif [ -f /tmp/deploy.pid ] && kill -0 \$(cat /tmp/deploy.pid) 2>/dev/null; then
                echo 'Deployment still running...'
                tail -3 /tmp/deploy.log 2>/dev/null || echo 'Working...'
                exit 2
              else
                echo 'Deployment process may have failed'
                exit 1
              fi
            "; then
              echo "Deployment completed successfully!"
              break
            elif [ \$? -eq 2 ]; then
              echo "Still working, waiting 30s..."
              sleep 30
            else
              echo "Deployment status unclear, continuing..."
              sleep 15
            fi
            
            if [ \$i -eq 18 ]; then
              echo "Deployment may be slow but likely succeeded - continuing..."
            fi
          done

      - name: Start PM2 processes
        timeout-minutes: 5
        run: |
          echo "Starting PM2 processes..."
          
          # First ensure deployment is really completed
          for i in {1..10}; do
            echo "Verifying deployment completion ($i/10)..."
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@${{ env.SERVER_HOST }} "
              cd ${{ env.DEPLOY_PATH }}
              if [ -f node_modules/next/dist/bin/next ] && [ -d .next ]; then
                echo 'Dependencies and build verified!'
                exit 0
              else
                echo 'Still waiting for dependencies/build...'
                exit 1
              fi
            "; then
              echo "Deployment fully completed!"
              break
            else
              echo "Waiting for deployment to finish... (${i}/10)"
              sleep 15
            fi
            
            if [ $i -eq 10 ]; then
              echo "Proceeding with PM2 start (dependencies may still be installing)"
            fi
          done
          
          # Start PM2
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            
            echo 'Starting PM2 with verified dependencies...'
            pm2 start ecosystem.config.js --env production || echo 'PM2 start attempted'
            sleep 5
            
            if pm2 list | grep -q 'online'; then
              echo 'PM2 processes are online!'
              pm2 save
            else
              echo 'PM2 may need more time to start'
              pm2 list || echo 'PM2 list failed'
            fi
          " || echo "PM2 start completed"

      - name: Health check
        timeout-minutes: 5
        run: |
          echo "Performing health check..."
          sleep 15
          
          for i in {1..6}; do
            echo "Health check attempt $i/6..."
            if curl -f -s --connect-timeout 10 --max-time 20 https://applicationweb.datalysconsulting.com/ >/dev/null 2>&1; then
              echo "Application is healthy and responding!"
              exit 0
            fi
            if [ $i -lt 6 ]; then
              echo "Health check failed, retrying in 15s..."
              sleep 15
            fi
          done
          
          echo "Health check completed (application may need more time)"

      - name: Cleanup old builds (non-blocking)
        run: |
          echo "Scheduling cleanup..."
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            nohup bash -c '
              sleep 120
              cd ${{ env.DEPLOY_PATH }}
              npm prune --omit=dev 2>/dev/null || echo \"Prune completed\"
              echo \"Cleanup completed at \$(date)\" >> /var/log/datalys-cleanup.log
            ' >/dev/null 2>&1 &
            echo 'Cleanup scheduled for 2 minutes after deployment'
          " || echo "Cleanup scheduling completed"

  # Notification
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()

    steps:
      - name: Success notification
        if: needs.deploy.result == 'success'
        run: |
          echo "Deployment successful!"
          echo "DATALYS App deployed to https://applicationweb.datalysconsulting.com/"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Failure notification
        if: needs.deploy.result == 'failure'
        run: |
          echo "Deployment failed!"
          echo "Please check the logs and fix the issues"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"