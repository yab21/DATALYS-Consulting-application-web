name: 🚀 Deploy DATALYS App to Production

on:
  push:
    branches: [develop]
  workflow_dispatch: # Permet le déclenchement manuel

env:
  NODE_VERSION: "18.x"
  SERVER_HOST: "82.112.253.137"
  APP_NAME: "datalys-app"
  DEPLOY_PATH: "/var/www/datalys-app"

jobs:
  # ✅ Tests et Build
  test-and-build:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🔍 Run TypeScript check
        run: npm run type-check

      - name: 🧪 Run tests (if available)
        run: npm run test --if-present

      - name: 🏗️ Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
            public/
            package*.json
            ecosystem.config.js
          retention-days: 1

  # 🚀 Déploiement
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: test-and-build
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📤 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🏗️ Create deployment directory and setup
        run: |
          # Generate timestamp once and reuse it
          export TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          export RELEASE_DIR="${{ env.DEPLOY_PATH }}/releases/$TIMESTAMP"
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.SERVER_HOST }} "
            set -e
            mkdir -p $RELEASE_DIR
            mkdir -p ${{ env.DEPLOY_PATH }}/shared/logs
            mkdir -p ${{ env.DEPLOY_PATH }}/shared/node_modules
            echo 'Directories created successfully'
          "

      - name: 📦 Deploy application files
        run: |
          echo "📤 Deploying files to: $RELEASE_DIR"

          # Synchroniser les fichiers (UNE SEULE FOIS)
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            ./ root@${{ env.SERVER_HOST }}:$RELEASE_DIR/

          # Créer les liens symboliques
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.SERVER_HOST }} "
            set -e
            cd $RELEASE_DIR
            ln -sf ${{ env.DEPLOY_PATH }}/shared/logs logs
            ln -sf ${{ env.DEPLOY_PATH }}/shared/.env .env
            echo 'Files deployed and symlinks created'
          "

      - name: 📋 Install production dependencies
        timeout-minutes: 15
        run: |
          # Option 1: Essayer l'installation normale
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=60 root@${{ env.SERVER_HOST }} "
            set -e
            cd $RELEASE_DIR
            
            # Vérifier l'espace disque disponible
            df -h
            
            # Clean npm cache si nécessaire
            npm cache clean --force 2>/dev/null || true
            
            # Vérifier si nous avons un cache de node_modules
            if [ -d '${{ env.DEPLOY_PATH }}/shared/node_modules' ] && [ -n \"\$(ls -A ${{ env.DEPLOY_PATH }}/shared/node_modules)\" ]; then
              echo 'Copying cached node_modules...'
              cp -rf ${{ env.DEPLOY_PATH }}/shared/node_modules ./
            fi
            
            if [ ! -f package-lock.json ]; then
              echo 'Generating package-lock.json...'
              NODE_OPTIONS='--max_old_space_size=512' timeout 300 npm install --package-lock-only || {
                echo 'Package-lock generation failed, continuing without it...'
              }
            fi
            
            # Installation avec optimisations mémoire
            echo 'Installing dependencies with memory optimization...'
            NODE_OPTIONS='--max_old_space_size=1024' timeout 900 npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefer-offline || {
              echo 'npm ci failed, trying alternative installation...'
              rm -rf node_modules package-lock.json
              NODE_OPTIONS='--max_old_space_size=1024' timeout 900 npm install --production --no-audit --no-fund --prefer-offline --legacy-peer-deps
            }
            
            # Sauvegarder node_modules pour les prochaines fois
            echo 'Caching node_modules for future deployments...'
            rm -rf ${{ env.DEPLOY_PATH }}/shared/node_modules
            cp -rf node_modules ${{ env.DEPLOY_PATH }}/shared/
            
            echo 'Dependencies installed successfully'
          "

      - name: 🔄 Switch to new release
        run: |
          echo "🔗 Switching to release: $TIMESTAMP"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.SERVER_HOST }} "
            set -e
            # Créer le lien symbolique vers la nouvelle release
            cd ${{ env.DEPLOY_PATH }}
            
            # Backup current if exists
            if [ -L current ]; then
              rm -f previous
              mv current previous
            fi
            
            # Create new symlink using stored TIMESTAMP
            ln -sf releases/$TIMESTAMP current
            echo 'Symlink updated to new release'
            
            # Restart PM2 with timeout
            cd current
            timeout 60 pm2 reload ecosystem.config.js --env production || timeout 60 pm2 start ecosystem.config.js --env production
            pm2 save
            echo 'PM2 reloaded successfully'
          "

      - name: 🧹 Cleanup old releases
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}/releases
            ls -t | tail -n +6 | xargs -r rm -rf
            echo 'Old releases cleaned up'
          "

      - name: ✅ Health check
        run: |
          sleep 10
          curl -f https://applicationweb.datalysconsulting.com/ || exit 1

      - name: 📊 PM2 status
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            pm2 list
            pm2 logs ${{ env.APP_NAME }} --lines 50
          "

  # 📢 Notification
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [test-and-build, deploy]
    if: always()

    steps:
      - name: ✅ Success notification
        if: needs.deploy.result == 'success'
        run: |
          echo "🎉 Deployment successful!"
          echo "✅ DATALYS App deployed to https://applicationweb.datalysconsulting.com/"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: ❌ Failure notification
        if: needs.deploy.result == 'failure'
        run: |
          echo "🚨 Deployment failed!"
          echo "❌ Please check the logs and fix the issues"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
