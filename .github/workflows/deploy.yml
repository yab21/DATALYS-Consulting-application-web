name: 🚀 Deploy DATALYS App to Production

on:
  push:
    branches: [develop]
  workflow_dispatch: # Permet le déclenchement manuel

env:
  NODE_VERSION: "18.x"
  SERVER_HOST: "82.112.253.137"
  APP_NAME: "datalys-app"
  DEPLOY_PATH: "/var/www/datalys-app"

jobs:
  # ✅ Tests 
  test:
    name: 🧪 Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📋 Install dependencies
        run: npm ci

      - name: 🔍 Run TypeScript check
        run: npm run type-check

      - name: 🧪 Run tests (if available)
        run: npm run test --if-present

  # 🚀 Déploiement
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🏗️ Create deployment directory and setup
        run: |
          # Generate timestamp once and reuse it
          export TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          export RELEASE_DIR="${{ env.DEPLOY_PATH }}/releases/$TIMESTAMP"
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.SERVER_HOST }} "
            set -e
            mkdir -p $RELEASE_DIR
            mkdir -p ${{ env.DEPLOY_PATH }}/shared/logs
            mkdir -p ${{ env.DEPLOY_PATH }}/shared/node_modules
            echo 'Directories created successfully'
          "

      - name: 📦 Deploy source code
        run: |
          echo "📤 Deploying source code to: $RELEASE_DIR"

          # Synchroniser le code source
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='.next' \
            ./ root@${{ env.SERVER_HOST }}:$RELEASE_DIR/

          # Créer les liens symboliques
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.SERVER_HOST }} "
            set -e
            cd $RELEASE_DIR
            ln -sf ${{ env.DEPLOY_PATH }}/shared/logs logs
            ln -sf ${{ env.DEPLOY_PATH }}/shared/.env .env
            echo 'Source files deployed and symlinks created'
          "

      - name: 📋 Install dependencies and build on server
        timeout-minutes: 35
        run: |
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=120 -o ServerAliveCountMax=5 root@${{ env.SERVER_HOST }} "
            set -e
            cd $RELEASE_DIR
            
            echo '🔍 Optimized installation and build process...'
            export NODE_OPTIONS='--max_old_space_size=512'
            export NPM_CONFIG_AUDIT=false
            export NPM_CONFIG_FUND=false
            export NPM_CONFIG_PROGRESS=false
            export NPM_CONFIG_LOGLEVEL=error
            
            # Try to copy node_modules from a working previous release
            LATEST_WORKING=\$(ls -t ../*/node_modules 2>/dev/null | head -1 | cut -d'/' -f2 || echo '')
            if [ -n \"\$LATEST_WORKING\" ] && [ -d \"../\$LATEST_WORKING/node_modules\" ]; then
              echo '📦 Copying node_modules from previous release...'
              cp -r \"../\$LATEST_WORKING/node_modules\" ./
              echo '🔄 Updating dependencies...'
              npm ci --silent --prefer-offline --no-audit --no-fund || {
                echo '🔄 Update failed, full reinstall needed...'
                rm -rf node_modules package-lock.json
                npm install --silent --legacy-peer-deps --no-audit --no-fund
              }
            else
              echo '🔄 Fresh installation (no previous release found)...'
              npm ci --silent --prefer-offline --no-audit --no-fund || {
                echo '🔄 npm ci failed, trying npm install...'
                rm -rf node_modules package-lock.json
                npm install --silent --legacy-peer-deps --no-audit --no-fund
              }
            fi
            
            echo '🏗️ Building Next.js application...'
            NODE_OPTIONS='--max_old_space_size=512' npm run build
            
            echo '🧹 Removing dev dependencies after build...'
            npm prune --omit=dev --silent --no-audit
            
            echo '✅ Build completed successfully'
            
            # Verify build was created
            if [ -d '.next' ]; then
              echo '✅ .next directory found after build'
              ls -la .next/ | head -5
            else
              echo '❌ .next directory missing after build!'
              exit 1
            fi
          "

      - name: 🔄 Switch to new release
        timeout-minutes: 5
        run: |
          echo "🔗 Switching to release: $TIMESTAMP"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 root@${{ env.SERVER_HOST }} "
            set -e
            cd ${{ env.DEPLOY_PATH }}
            
            # Backup current if exists
            if [ -L current ]; then
              rm -f previous
              mv current previous
            fi
            
            # Create new symlink
            ln -sf releases/$TIMESTAMP current
            echo 'Symlink updated to new release'
            
            # Restart PM2 with better error handling
            cd current
            echo 'Restarting PM2...'
            pm2 stop datalys-app 2>/dev/null || echo 'App was not running'
            sleep 2
            pm2 start ecosystem.config.js --env production
            pm2 save
            echo 'PM2 restarted successfully'
          "

      - name: 🧹 Cleanup old releases
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}/releases
            ls -t | tail -n +6 | xargs -r rm -rf
            echo 'Old releases cleaned up'
          "

      - name: ✅ Health check
        timeout-minutes: 3
        run: |
          echo "🏥 Waiting for application to start..."
          sleep 15
          
          # Retry health check up to 5 times
          for i in {1..5}; do
            echo "Health check attempt $i/5..."
            if curl -f -s --connect-timeout 10 --max-time 15 https://applicationweb.datalysconsulting.com/ >/dev/null 2>&1; then
              echo "✅ Application is healthy and responding!"
              exit 0
            fi
            if [ $i -lt 5 ]; then
              echo "⚠️ Health check failed, retrying in 10s..."
              sleep 10
            fi
          done
          
          echo "❌ Health check failed after 5 attempts"
          echo "🔍 Checking PM2 status for debugging..."
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "pm2 list && pm2 logs datalys-app --lines 10" || true
          exit 1

      - name: 📊 Final verification
        run: |
          echo "🔍 Final deployment verification..."
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            echo '📊 PM2 Status:'
            pm2 list
            echo '📋 Application logs (last 10 lines):'
            pm2 logs ${{ env.APP_NAME }} --lines 10 2>/dev/null || echo 'No recent logs'
            echo '📂 Current release:'
            ls -la ${{ env.DEPLOY_PATH }}/current
            echo '✅ Deployment verification completed'
          "

  # 📢 Notification
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()

    steps:
      - name: ✅ Success notification
        if: needs.deploy.result == 'success'
        run: |
          echo "🎉 Deployment successful!"
          echo "✅ DATALYS App deployed to https://applicationweb.datalysconsulting.com/"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: ❌ Failure notification
        if: needs.deploy.result == 'failure'
        run: |
          echo "🚨 Deployment failed!"
          echo "❌ Please check the logs and fix the issues"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"