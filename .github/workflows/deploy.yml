name: Deploy DATALYS App - Production

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"
  SERVER_HOST: "152.228.130.133"
  APP_NAME: "datalys-app"
  DEPLOY_PATH: "/var/www/datalys-app-git"

jobs:
  # Build everything on GitHub Actions
  build:
    name: Build Complete Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install all dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run tests (if available)
        run: npm run test --if-present

      - name: Build Next.js application
        run: npm run build

      - name: Install production dependencies
        run: |
          rm -rf node_modules
          npm ci --omit=dev --prefer-offline --no-audit --no-fund --legacy-peer-deps

      - name: Optimize build for deployment
        run: |
          # Supprimer les source maps pour réduire la taille
          find .next -name "*.map" -type f -delete

          # Nettoyer les fichiers de développement dans node_modules
          find node_modules -name "*.md" -type f -delete
          find node_modules -name "*.txt" -type f -delete
          find node_modules -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "__tests__" -type d -exec rm -rf {} + 2>/dev/null || true
          find node_modules -name "*.test.js" -type f -delete
          find node_modules -name "*.spec.js" -type f -delete

          # Calculer la taille avant compression
          echo "Taille avant compression:"
          du -sh .next node_modules public

      - name: Create optimized deployment package
        run: |
          tar -czf complete-app.tar.gz \
            --exclude='*.map' \
            --exclude='node_modules/**/test' \
            --exclude='node_modules/**/tests' \
            --exclude='node_modules/**/__tests__' \
            --exclude='node_modules/**/*.test.js' \
            --exclude='node_modules/**/*.spec.js' \
            --exclude='node_modules/**/*.md' \
            --exclude='node_modules/**/.git' \
            .next \
            node_modules \
            package.json \
            package-lock.json \
            public \
            scripts \
            ecosystem.config.js \
            next.config.mjs

          echo "Taille du package final:"
          ls -lh complete-app.tar.gz

      - name: Upload complete application
        uses: actions/upload-artifact@v4
        with:
          name: complete-app
          path: complete-app.tar.gz
          retention-days: 1

  # Deploy without any npm operations on server
  deploy:
    name: Deploy Pre-built Application
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 2222 -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Download complete application
        uses: actions/download-artifact@v4
        with:
          name: complete-app

      - name: Deploy with aggressive cleanup
        timeout-minutes: 35
        run: |
          echo " Deploying optimized application with cleanup..."

          # Step 1: Aggressive server cleanup
          echo " Nettoyage agressif du serveur..."
          ssh -p 2222 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 ubuntu@${{ env.SERVER_HOST }} "
            echo 'Arrêt des processus...'

            pm2 stop all 2>/dev/null || true
            pm2 delete all 2>/dev/null || true
            pm2 kill 2>/dev/null || true

            sleep 2

            pkill -f 'pm2' 2>/dev/null || true
            pkill -f 'next-server' 2>/dev/null || true
            fuser -k 3000/tcp 2>/dev/null || true

            sleep 2

            echo 'Nettoyage espace disque...'
            rm -rf ${{ env.DEPLOY_PATH }}_backup_* 2>/dev/null || true
            rm -rf ${{ env.DEPLOY_PATH }}_new 2>/dev/null || true
            npm cache clean --force 2>/dev/null || true

            echo 'Espace disque avant deploiement:'
            df -h / || true

            echo 'Cleanup termine'
          " || true

          sleep 5

          # Step 2: Directory preparation (short connection) 
          echo "Preparing directories..."
          ssh -p 2222 -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=2 ubuntu@${{ env.SERVER_HOST }} "
            echo 'Setting up deployment directory...'
            mkdir -p ${{ env.DEPLOY_PATH }}_new
            cd ${{ env.DEPLOY_PATH }}_new
            echo 'Directory ready'
          "

          # Step 3: Transfer and extract (one connection)
          echo "Transferring pre-built application..."
          scp -P 2222 -o StrictHostKeyChecking=no complete-app.tar.gz ubuntu@${{ env.SERVER_HOST }}:${{ env.DEPLOY_PATH }}_new/

          # Step 4: Extraction and setup (short connection)
          ssh -p 2222 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 ubuntu@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}_new
            
            echo 'Extracting pre-built application...'
            tar -xzf complete-app.tar.gz
            rm complete-app.tar.gz
            
            echo 'Setting up environment links...'
            ln -sf /var/www/datalys-app/shared/.env .env
            ln -sf /var/www/datalys-app/shared/logs logs
            
            echo 'Verifying deployment...'
            if [ -f node_modules/next/dist/bin/next ] && [ -d .next ]; then
              echo 'Pre-built application verified!'
            else
              echo 'ERROR: Application not properly built'
              exit 1
            fi
            
            echo 'Atomic deployment switch...'
            if [ -d ${{ env.DEPLOY_PATH }} ]; then
              mv ${{ env.DEPLOY_PATH }} ${{ env.DEPLOY_PATH }}_backup_\$(date +%H%M%S)
            fi
            mv ${{ env.DEPLOY_PATH }}_new ${{ env.DEPLOY_PATH }}
            
            echo 'Creating required symbolic links...'
            cd ${{ env.DEPLOY_PATH }}
            mkdir -p shared/logs
            ln -sf ${{ env.DEPLOY_PATH }}/shared/.env .env
            ln -sf ${{ env.DEPLOY_PATH }}/shared/logs logs
            
            echo ' Starting PM2...'
            
            # Démarrage PM2 avec méthode alternative plus fiable
            timeout 60s pm2 start npm --name 'datalys-app' -- start || {
              echo 'PM2 start timeout, trying with ecosystem config...'
              timeout 30s pm2 start ecosystem.config.js --env production || {
                echo 'PM2 start failed, checking logs...'
                pm2 logs --lines 10 2>/dev/null || echo 'No PM2 logs available'
                exit 1
              }
            }
            
            sleep 5
            timeout 15s pm2 save || echo 'PM2 save timeout (non-critical)'
            
            # Vérification que l'application est démarrée
            pm2 list | grep -E '(online|stopped|errored)' || echo 'PM2 status unclear'
            
            echo ' Espace disque après déploiement:'
            df -h | grep -E '(Filesystem|/$)'
            
            echo ' Deployment completed - optimized for disk usage!'
          "

      - name: Final validation and cleanup
        timeout-minutes: 3
        run: |
          echo " Health check et nettoyage final..."

          # Exécuter le nettoyage automatique depuis le répertoire déployé
          ssh -p 2222 -o StrictHostKeyChecking=no ubuntu@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            if [ -f scripts/disk-cleanup.sh ]; then
              chmod +x scripts/disk-cleanup.sh
              # Créer le fichier log avec les permissions appropriées
              sudo touch /var/log/disk-cleanup.log
              sudo chown ubuntu:ubuntu /var/log/disk-cleanup.log
              nohup scripts/disk-cleanup.sh > /var/log/disk-cleanup.log 2>&1 &
              echo 'Script de nettoyage lancé en arrière-plan depuis le répertoire déployé'
            else
              echo 'Script disk-cleanup.sh non trouvé dans le déploiement'
            fi
          "

          sleep 15

          # Health check (version originale mais plus rapide)
          for i in {1..3}; do
            if curl -f -s --connect-timeout 10 --max-time 15 https://applicationweb.datalysconsulting.com/ >/dev/null 2>&1; then
              echo " Application is healthy!"
              
              # Afficher le résultat du nettoyage
              ssh -p 2222 -o StrictHostKeyChecking=no ubuntu@${{ env.SERVER_HOST }} "
                echo ' Résultat du nettoyage:'
                tail -10 /var/log/disk-cleanup.log 2>/dev/null || echo 'Nettoyage en cours...'
              " || true
              
              exit 0
            fi
            echo "Attempt $i/3, waiting..."
            sleep 8
          done

          echo "Application deployed but may need more time"

  # Notification
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: Success notification
        if: needs.deploy.result == 'success'
        run: |
          echo " Deployment optimized successful!"
          echo " Build size optimized (source maps removed, dev files cleaned)"
          echo " Aggressive disk cleanup performed"
          echo " Logs rotated and caches cleared"
          echo " DATALYS App: https://applicationweb.datalysconsulting.com/"

      - name: Failure notification
        if: needs.deploy.result == 'failure'
        run: |
          echo " Optimized deployment failed!"
          echo "Check logs for disk space or deployment issues"
