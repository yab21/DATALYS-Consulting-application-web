name: Deploy DATALYS App to Production

on:
  push:
    branches: [develop]
  workflow_dispatch: # Permet le déclenchement manuel

env:
  NODE_VERSION: "18.x"
  SERVER_HOST: "82.112.253.137"
  APP_NAME: "datalys-app"
  DEPLOY_PATH: "/var/www/datalys-app"

jobs:
  # Tests 
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run tests (if available)
        run: npm run test --if-present

  # Build sur GitHub Actions (serveurs rapides)
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies with cache
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Build Next.js application
        run: |
          npm run build

      - name: Install production dependencies
        run: |
          npm ci --omit=dev --prefer-offline --no-audit --no-fund

      - name: Create deployment package
        run: |
          tar -czf deployment.tar.gz .next package.json package-lock.json public ecosystem.config.js node_modules

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: deployment.tar.gz
          retention-days: 1

  # Déploiement optimisé
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create deployment directory and setup
        run: |
          # Generate timestamp once and reuse it
          export TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          export RELEASE_DIR="${{ env.DEPLOY_PATH }}/releases/$TIMESTAMP"
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.SERVER_HOST }} "
            set -e
            mkdir -p $RELEASE_DIR
            mkdir -p ${{ env.DEPLOY_PATH }}/shared/logs
            mkdir -p ${{ env.DEPLOY_PATH }}/shared/node_modules
            echo 'Directories created successfully'
          "

      - name: Deploy source code
        run: |
          echo "📤 Deploying source code to: $RELEASE_DIR"

          # Synchroniser le code source
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='.next' \
            ./ root@${{ env.SERVER_HOST }}:$RELEASE_DIR/

          # Créer les liens symboliques
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@${{ env.SERVER_HOST }} "
            set -e
            cd $RELEASE_DIR
            ln -sf ${{ env.DEPLOY_PATH }}/shared/logs logs
            ln -sf ${{ env.DEPLOY_PATH }}/shared/.env .env
            echo 'Source files deployed and symlinks created'
          "

      - name: Deploy built application to server
        timeout-minutes: 5
        run: |
          echo "Transferring complete application to: $RELEASE_DIR"
          
          # Transfer and extract complete application (including node_modules)
          scp -o StrictHostKeyChecking=no deployment.tar.gz root@${{ env.SERVER_HOST }}:$RELEASE_DIR/
          
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=5 root@${{ env.SERVER_HOST }} "
            set -e
            cd $RELEASE_DIR
            
            echo 'Extracting complete application...'
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            
            echo 'Application ready - no dependency installation needed!'
            
            # Verify build artifacts
            if [ -d '.next' ]; then
              echo '.next directory found'
              ls -la .next/ | head -3
            else
              echo '.next directory missing!'
              exit 1
            fi
            
            if [ -d 'node_modules' ]; then
              echo 'node_modules directory found'
              ls node_modules/ | head -5
            else
              echo 'node_modules directory missing!'
              exit 1
            fi
          "

      - name: Switch to new release  
        timeout-minutes: 5
        run: |
          echo "Switching to release: $TIMESTAMP"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 root@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            
            # Backup current if exists
            if [ -L current ]; then
              rm -f previous
              mv current previous
            fi
            
            # Create new symlink
            ln -sf releases/$TIMESTAMP current
            echo 'Symlink updated to new release'
          "

      - name: Stop PM2 processes
        timeout-minutes: 5
        run: |
          echo "Stopping existing PM2 processes..."
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            pm2 delete datalys-app 2>/dev/null || echo 'No processes to delete'
            sleep 3
            echo 'PM2 processes stopped'
          "

      - name: Start PM2 processes
        timeout-minutes: 8
        run: |
          echo "Starting fresh PM2 processes..."
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}/current
            
            # Start PM2 processes
            pm2 start ecosystem.config.js --env production
            
            # Wait for processes to be online
            echo 'Waiting for processes to start...'
            for i in {1..30}; do
              if pm2 list | grep -q 'online'; then
                echo 'PM2 processes are online!'
                pm2 save
                exit 0
              fi
              echo \"Waiting for PM2... (\$i/30)\"
              sleep 10
            done
            
            echo 'PM2 processes may be slow but started'
            pm2 save
          "

      - name: Cleanup old releases
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}/releases
            ls -t | tail -n +6 | xargs -r rm -rf
            echo 'Old releases cleaned up'
          "

      - name: Health check
        timeout-minutes: 8
        run: |
          echo "Waiting for slow VPS application to start..."
          sleep 30
          
          # Retry health check up to 10 times for slow VPS
          for i in {1..10}; do
            echo "Health check attempt $i/10..."
            if curl -f -s --connect-timeout 20 --max-time 30 https://applicationweb.datalysconsulting.com/ >/dev/null 2>&1; then
              echo "Application is healthy and responding!"
              exit 0
            fi
            if [ $i -lt 10 ]; then
              echo "Health check failed, retrying in 20s... (VPS needs time)"
              sleep 20
            fi
          done
          
          echo "Health check failed after 10 attempts"
          echo "Checking PM2 status for debugging..."
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "pm2 list && pm2 logs datalys-app --lines 15" || true
          echo "Deployment may still be successful but application is slow to respond"
          exit 0

      - name: Final verification
        run: |
          echo "Final deployment verification..."
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            echo 'PM2 Status:'
            pm2 list
            echo 'Application logs (last 10 lines):'
            pm2 logs ${{ env.APP_NAME }} --lines 10 2>/dev/null || echo 'No recent logs'
            echo 'Current release:'
            ls -la ${{ env.DEPLOY_PATH }}/current
            echo 'Deployment verification completed'
          "

  # Notification
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always()

    steps:
      - name: Success notification
        if: needs.deploy.result == 'success'
        run: |
          echo "Deployment successful!"
          echo "DATALYS App deployed to https://applicationweb.datalysconsulting.com/"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Failure notification
        if: needs.deploy.result == 'failure'
        run: |
          echo "Deployment failed!"
          echo "Please check the logs and fix the issues"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"