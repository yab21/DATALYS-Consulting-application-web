name: Deploy DATALYS App - Minimal (No npm on server)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: "18.x"
  SERVER_HOST: "82.112.253.137"
  APP_NAME: "datalys-app"
  DEPLOY_PATH: "/var/www/datalys-app-git"

jobs:
  # Build everything on GitHub Actions
  build:
    name: Build Complete Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install all dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run tests (if available)
        run: npm run test --if-present

      - name: Build Next.js application
        run: npm run build

      - name: Install production dependencies
        run: |
          rm -rf node_modules
          npm ci --omit=dev

      - name: Create complete deployment package
        run: |
          tar -czf complete-app.tar.gz \
            .next \
            node_modules \
            package.json \
            package-lock.json \
            public \
            ecosystem.config.js \
            next.config.mjs

      - name: Upload complete application
        uses: actions/upload-artifact@v4
        with:
          name: complete-app
          path: complete-app.tar.gz
          retention-days: 1

  # Deploy without any npm operations on server
  deploy:
    name: Deploy Pre-built Application
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Download complete application
        uses: actions/download-artifact@v4
        with:
          name: complete-app

      - name: Deploy to server (NO npm operations)
        timeout-minutes: 8
        run: |
          echo "Deploying pre-built application..."
          
          # Create backup timestamp
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            echo 'Stopping services...'
            pm2 delete datalys-app 2>/dev/null || echo 'PM2 not running'
            
            echo 'Creating backup and new directory...'
            if [ -d ${{ env.DEPLOY_PATH }}_backup ]; then
              rm -rf ${{ env.DEPLOY_PATH }}_backup_old
              mv ${{ env.DEPLOY_PATH }}_backup ${{ env.DEPLOY_PATH }}_backup_old
            fi
            
            if [ -d ${{ env.DEPLOY_PATH }} ]; then
              cp -r ${{ env.DEPLOY_PATH }} ${{ env.DEPLOY_PATH }}_backup
            fi
            
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}
          "
          
          echo "Transferring pre-built application..."
          scp -o StrictHostKeyChecking=no complete-app.tar.gz root@${{ env.SERVER_HOST }}:${{ env.DEPLOY_PATH }}/
          
          ssh -o StrictHostKeyChecking=no root@${{ env.SERVER_HOST }} "
            cd ${{ env.DEPLOY_PATH }}
            
            echo 'Extracting pre-built application...'
            tar -xzf complete-app.tar.gz
            rm complete-app.tar.gz
            
            echo 'Setting up environment links...'
            ln -sf /var/www/datalys-app/shared/.env .env
            ln -sf /var/www/datalys-app/shared/logs logs
            
            echo 'Verifying deployment...'
            if [ -f node_modules/next/dist/bin/next ] && [ -d .next ]; then
              echo 'Pre-built application verified!'
            else
              echo 'ERROR: Application not properly built'
              exit 1
            fi
            
            echo 'Starting PM2...'
            pm2 start ecosystem.config.js --env production
            sleep 3
            pm2 save
            
            echo 'Deployment completed - no npm operations on server!'
          "

      - name: Health check
        timeout-minutes: 3
        run: |
          echo "Health check..."
          sleep 15
          
          for i in {1..4}; do
            if curl -f -s --connect-timeout 10 --max-time 15 https://applicationweb.datalysconsulting.com/ >/dev/null 2>&1; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Attempt $i/4, waiting..."
            sleep 10
          done
          
          echo "Application deployed but may need more time"

  # Notification
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: Success notification
        if: needs.deploy.result == 'success'
        run: |
          echo "Minimal deployment successful!"
          echo "No npm operations on server - completely pre-built!"
          echo "DATALYS App: https://applicationweb.datalysconsulting.com/"

      - name: Failure notification
        if: needs.deploy.result == 'failure'
        run: |
          echo "Minimal deployment failed!"
          echo "Check logs for issues"